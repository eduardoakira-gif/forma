# Publica o Forma no GitHub Pages a cada alteração: https://eduardoakira-gif.github.io/forma/
name: Publicar site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - name: Testes
        run: node tests/forma-calc.test.mjs
      - name: Montar site (só os arquivos do app)
        run: |
          mkdir _site
          cp *.html *.js *.css *.png *.svg *.webmanifest _site/
          V=${GITHUB_SHA::7}
          sed -i "s/forma-v[0-9a-z]*/forma-$V/" _site/sw.js
          sed -i "s#href=\"style.css\"#href=\"style.css?v=$V\"#; s#src=\"config.js\"#src=\"config.js?v=$V\"#" _site/index.html
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - uses: actions/deploy-pages@v4
        id: deployment
